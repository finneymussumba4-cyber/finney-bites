<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | FINNEY BITES</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff5e9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .reset-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: min(90%, 380px);
            box-shadow: 0 4px 18px #0002;
        }
        h2 { color: #f47721; }
        label { display: block; margin-top: 15px; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #f47721;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        #message { margin-top: 15px; }
    </style>
</head>
<body>
    <div class="reset-box">
        <h2>Reset Your Password</h2>
        <p>Enter your new password below.</p>

        <form id="resetForm">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" minlength="8" maxlength="128" required>

            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" minlength="8" maxlength="128" required>

            <button type="submit">Update Password</button>
        </form>

        <p id="message" role="status"></p>
    </div>

    <script>
        const resetForm = document.getElementById("resetForm");
        const message = document.getElementById("message");
        const token = new URLSearchParams(window.location.search).get("token");

        if (!token) {
            message.textContent = "Reset link is missing. Please request another link.";
            resetForm.hidden = true;
        }

        resetForm.addEventListener("submit", async event => {
            event.preventDefault();

            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (newPassword !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            try {
                const response = await fetch("/api/auth/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        token,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || "Password reset failed.");
                }

                message.textContent = result.message;
                resetForm.hidden = true;
            } catch (error) {
                message.textContent = error.message;
            }
        });
    </script>
</body>
</html>
